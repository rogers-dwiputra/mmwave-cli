[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "telegraf-iosar"

# ── Output: InfluxDB Cloud ────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["https://us-east-1-1.aws.cloud2.influxdata.com"]
  token        = "${INFLUXDB_TOKEN}"
  organization = "fa0efd0230808dbd"
  bucket       = "iosar"

# ── Input: TTN MQTT ───────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers   = ["ssl://imrsl.as1.cloud.thethings.industries:8883"]
  topics    = ["v3/iosar-imrsl@imrsl/devices/+/up"]
  username  = "iosar-imrsl@imrsl"
  password  = "${TTN_API_KEY}"
  qos       = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name    = "uplink"
    timestamp_path      = "uplink_message.received_at"
    timestamp_format    = "2006-01-02T15:04:05.999999999Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path   = "end_device_ids.device_id"
      rename = "device_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "uplink_message.decoded_payload.dominant_frequency_hz"
      rename = "dominant_frequency_hz"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "uplink_message.decoded_payload.max_deflection_mm"
      rename = "max_deflection_mm"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "uplink_message.decoded_payload.displacement_rms_mm"
      rename = "displacement_rms_mm"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "uplink_message.decoded_payload.displacement_rms_um"
      rename = "displacement_rms_um"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "uplink_message.decoded_payload.max_deflection_um"
      rename = "max_deflection_um"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "uplink_message.decoded_payload.temperature_c"
      rename = "temperature_c"
      type   = "float"

